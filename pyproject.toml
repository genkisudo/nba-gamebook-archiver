[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbwatch"
version = "0.1.0"
description = "Capture every version of NBA official game-book PDFs and alert on post-final changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gbwatch = "gbwatch.cli:cli"

[tool.setuptools.packages.find]
include = ["gbwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
